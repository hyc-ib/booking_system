<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>公務車系統</title>

{% load static %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* =======================
   BASE
======================= */
body {
    margin: 0;
    display: flex;
    min-height: 100vh;
    background: #f5f6f8;
}

/* =======================
   SIDEBAR (WHITE)
======================= */
.sidebar {
    width: 200px;
    background: #ffffff;
    color: #111827;
    transition: 0.3s;
    display: flex;
    flex-direction: column;

    border-right: 1px solid #e5e7eb;
}

.sidebar.collapsed {
    width: 90px;
}

/* toggle button */
.toggle-btn {
    background: none;
    border: none;
    color: #111827;
    font-size: 25px;
    padding: 30px;
    text-align: left;
}

/* menu */
.menu {
    display: flex;
    flex-direction: column;
    margin-top: 10px;
}

/* menu item */
.menu a {
    color: #111827;
    text-decoration: none;
    padding: 12px 15px;
    display: flex;
    align-items: center;
    gap: 12px;

    border-radius: 10px;
    margin: 4px 8px;

    transition: 0.2s;
}

/* hover */
.menu a:hover {
    background: #f3f4f6;
}

/* active click */
.menu a:active {
    background: #e5e7eb;
}

/* =======================
   ICON FIX
======================= */
.icon-img {
    width: 40px;     /* ⭐ 不要太大 */
    height: 40px;
    object-fit: contain;

    /* ⭐ 解決黑色透明 icon 看不到問題 */
    filter: grayscale(100%) brightness(0.4);
}

/* =======================
   COLLAPSE TEXT
======================= */
.sidebar.collapsed .text {
    display: none;
}

/* =======================
   MAIN AREA
======================= */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

/* topbar */
.topbar {
    background: #ffffff;
    padding: 10px 20px;
    display: flex;
    justify-content: flex-end;
    border-bottom: 1px solid #e5e7eb;
}

.user {
    font-weight: 600;
    color: #111827;
}

/* content */
.content {
    padding: 20px;
    background: #f5f6f8;
}

</style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">

    <button class="toggle-btn" onclick="toggleSidebar()">☰</button>

    <div class="menu">

        <a href="{% url 'home' %}">
            <img src="{% static 'images/home_icon.png' %}" class="icon-img">
            <span class="text">首頁</span>
        </a>

        <a href="/reserve/">
            <img src="{% static 'images/rentCar_icon.png' %}" class="icon-img">
            <span class="text">借車系統</span>
        </a>

        <a href="/checkin/">
            <img src="{% static 'images/checkIn_icon.png' %}" class="icon-img">
            <span class="text">報到系統</span>
        </a>

        <a href="/return/">
            <img src="{% static 'images/returnCar_icon.png' %}" class="icon-img">
            <span class="text">還車系統</span>
        </a>

        <a href="/history/">
            <img src="{% static 'images/history_icon.png' %}" class="icon-img">
            <span class="text">歷史紀錄</span>
        </a>

        <a href="/profile/">
            <img src="{% static 'images/user_icon.png' %}" class="icon-img">
            <span class="text">個人資訊</span>
        </a>

    </div>
</div>

<!-- Main -->
<div class="main">

    <div class="topbar">

        {% if user.is_authenticated %}
            <span class="user">{{ request.user.username }} 您好</span>
        {% else %}
            <span class="user">您好</span>
        {% endif %}

    </div>

    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

</div>

<script>
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

if (!sessionStorage.getItem("tz_sent")) {
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;

    fetch('/set-timezone/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken')
        },
        body: JSON.stringify({ timezone: tz })
    });

    sessionStorage.setItem("tz_sent", "1");
}

function toggleSidebar(){
    document.getElementById("sidebar").classList.toggle("collapsed");
}
</script>

</body>
</html>
