{% load static %}

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>公務車預約系統</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .hero {
            height: 100vh;
            background: url("{% static 'images/bookingSys_bg.png' %}") no-repeat center center;
            background-size: cover;
            position: relative;
            color: white;
        }

        /* 半透明遮罩（讓文字更清楚） */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 30, 0.6);
        }

        .content {
            position: absolute;
            top: 10%;
            left: 5%;
            z-index: 2;
        }

        h1 {
            font-size: 65px;
            margin-bottom: 300px;
        }

        .btn {
            display: inline-block;
            padding: 15px 40px;
            border-radius: 30px;
            background: white;
            color: #1a3cff;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn:hover {
            background: #1a3cff;
            color: white;
        }
    </style>
</head>

<body>

<div class="hero">
    <div class="overlay"></div>

    <div class="content">
        <h1>公務車預約系統</h1>

        <a href="{% url 'login' %}" class="btn">
            註冊 / 登入
        </a>
    </div>
</div>

</body>
</html>
