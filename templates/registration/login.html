{% load static %}
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>登入 / 註冊</title>

<style>
body {
    margin: 0;
    font-family: Arial;
}

.hero {
    height: 100vh;
    position: relative;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

.hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: url("{% static 'images/bookingSys_bg.png' %}") no-repeat center center;
    background-size: cover;
    z-index: 0;
}

.hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.55);
    z-index: 1;
}

.title {
    position: absolute;
    top: 20px;
    left: 20px;
    font-size: 48px;
    color: #1f4ed8;
    font-weight: bold;
    z-index: 10;
}

.card {
    width: 600px;
    padding: 30px;
    border-radius: 20px;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(0,0,0,0.08);
    box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    color: #111;
    z-index: 2;
}

input.phone {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ddd;
    margin-bottom: 15px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
}

.btn-primary {
    background: #1f4ed8;
    color: white;
}

.btn-primary:disabled {
    background: #ccc;
    color: #888;
    cursor: not-allowed;
}

.otp-container {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 15px 0;
}

.otp-box {
    width: 45px;
    height: 50px;
    text-align: center;
    font-size: 20px;
    border-radius: 10px;
    border: 1px solid #ddd;
}

.msg {
    text-align: center;
    margin-top: 10px;
    font-size: 14px;
}

/* modal */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 999;
    justify-content: center;
    align-items: center;
}

.modal-content {
    width: 600px;
    max-width: 90%;
    background: white;
    border-radius: 15px;
    padding: 20px;
}

.modal-body {
    max-height: 300px;
    overflow-y: auto;
}

.close {
    float: right;
    font-size: 20px;
    cursor: pointer;
}

label a {
    color: #1f4ed8;
}
</style>
</head>

<body>

<div class="title">登入 / 註冊</div>

<div class="hero">

<div class="card">

    <input class="phone" id="phone" placeholder="手機號碼">

    <label>
        <input type="checkbox" id="agree" disabled>
        我已閱讀並同意
        <a href="#" id="privacyLink">隱私權條款</a>
    </label>

    <br><br>

    <button id="sendBtn" class="btn-primary" disabled>寄送驗證碼</button>

    <div class="otp-container">
        <input class="otp-box" maxlength="1">
        <input class="otp-box" maxlength="1">
        <input class="otp-box" maxlength="1">
        <input class="otp-box" maxlength="1">
        <input class="otp-box" maxlength="1">
        <input class="otp-box" maxlength="1">
    </div>

    <button id="loginBtn" class="btn-primary" disabled>完成</button>

    <div id="msg" class="msg"></div>

</div>

</div>

<!-- modal -->
<div id="privacyModal" class="modal">
    <div class="modal-content">
        <span id="closeModal" class="close">&times;</span>
        <h2>隱私權條款</h2>

        <div id="policyBox" class="modal-body">
            <p>請完整閱讀條款內容...</p>
            <p>系統僅用於手機驗證</p>
            <p>不得外流資料</p>
            <div style="height:200px;"></div>
        </div>
    </div>
</div>

<script>
const phone = document.getElementById("phone");
const agree = document.getElementById("agree");
const sendBtn = document.getElementById("sendBtn");
const loginBtn = document.getElementById("loginBtn");
const otpBoxes = document.querySelectorAll(".otp-box");
const msg = document.getElementById("msg");

const modal = document.getElementById("privacyModal");
const policyBox = document.getElementById("policyBox");

let readDone = false;

/* ===== CSRF 初始化（⭐關鍵） ===== */
fetch('/get-csrf-token/', {
    method: 'GET',
    credentials: 'include'
});

/* ===== modal ===== */
document.getElementById("privacyLink").onclick = (e)=>{
    e.preventDefault();
    modal.style.display="flex";
};

document.getElementById("closeModal").onclick = ()=>{
    modal.style.display="none";
};

window.onclick = (e)=>{
    if(e.target===modal) modal.style.display="none";
};

/* 必須滑到底 */
policyBox.addEventListener("scroll", ()=>{
    if(policyBox.scrollTop + policyBox.clientHeight >= policyBox.scrollHeight - 5){
        readDone = true;
        agree.disabled = false;
    }
});

/* ===== OTP ===== */
function getOTP(){
    return Array.from(otpBoxes).map(b=>b.value).join("");
}

function checkOTP(){
    loginBtn.disabled = getOTP().length !== 6;
}

otpBoxes.forEach((box,i)=>{
    box.addEventListener("input",()=>{
        box.value = box.value.replace(/\D/g,"");

        if(box.value && i<5){
            otpBoxes[i+1].focus();
        }

        checkOTP();
    });

    box.addEventListener("keydown",(e)=>{
        if(e.key==="Backspace" && !box.value && i>0){
            otpBoxes[i-1].focus();
        }
    });
});

/* paste */
otpBoxes[0].addEventListener("paste",(e)=>{
    e.preventDefault();

    let data = e.clipboardData.getData("text")
        .replace(/\D/g,"")
        .slice(0,6);

    otpBoxes.forEach((b,i)=>b.value=data[i]||"");
    checkOTP();
});

/* ===== send button ===== */
let timer=null;

function updateSend(){
    const okPhone = /^09\d{8}$/.test(phone.value);
    sendBtn.disabled = !(okPhone && agree.checked && readDone);
}

phone.addEventListener("input",updateSend);
agree.addEventListener("change",updateSend);

/* countdown */
function startCountdown(){
    let sec=60;
    sendBtn.disabled=true;

    timer=setInterval(()=>{
        sendBtn.innerText=sec+" 秒";
        sec--;

        if(sec<0){
            clearInterval(timer);
            sendBtn.innerText="重新發送";
            updateSend();
        }
    },1000);
}

/* ===== CSRF helper ===== */
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.startsWith(name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

/* ===== send OTP ===== */
sendBtn.onclick=()=>{
    fetch('/send_otp/',{
        method:'POST',
        credentials: 'include',  // ⭐關鍵
        headers:{
            'Content-Type':'application/x-www-form-urlencoded',
            'X-CSRFToken': getCookie('csrftoken')
        },
        body:'phone='+phone.value
    })
    .then(res => res.json())
    .then(data=>{
        msg.innerText = data.message || "OTP已發送";
        startCountdown();
    })
    .catch(()=>{
        msg.innerText="發送失敗";
        msg.style.color="red";
    });
};

/* ===== verify OTP ===== */
loginBtn.onclick = () => {

    let otp = getOTP();

    fetch('/verify_otp/', {
        method: 'POST',
        credentials: 'include',  // ⭐關鍵
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-CSRFToken': getCookie('csrftoken')
        },
        body: `phone=${phone.value}&otp=${otp}`
    })
    .then(res => res.json())
    .then(data => {

        if (data.status === "login_success") {
            window.location.href = data.redirect;
        }
        else if (data.status === "need_register") {
            window.location.href = "/register/";
        }
        else {
            msg.innerText = "OTP 錯誤";
            msg.style.color = "red";
        }
    });
};
</script>
</body>
</html>
