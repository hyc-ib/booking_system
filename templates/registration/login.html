{% load static %}
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>登入 / 註冊</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

/* ===== 背景（專業柔和光感） ===== */
.hero {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(circle at 20% 20%, rgba(99,102,241,0.15), transparent 40%),
        radial-gradient(circle at 80% 30%, rgba(236,72,153,0.12), transparent 40%),
        radial-gradient(circle at 50% 80%, rgba(59,130,246,0.10), transparent 45%),
        #f4f6f9;
}

/* ===== 卡片 ===== */
.card {
    width: 380px;
    padding: 32px;
    border-radius: 18px;

    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);

    border: 1px solid rgba(0,0,0,0.06);
    box-shadow: 0 15px 40px rgba(0,0,0,0.12);
}

/* ===== 標題（改成卡片內） ===== */
.login-title {
    text-align: center;
    font-size: 25px;
    font-weight: 600;
    color: #1f2937;
    margin-bottom: 22px;
}

/* ===== input ===== */
input.phone {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ddd;
    box-sizing: border-box;
    margin-bottom: 14px;
    transition: 0.2s;
}

input:focus {
    outline: none;
    border-color: #1f4ed8;
    box-shadow: 0 0 0 3px rgba(31,78,216,0.15);
}

/* ===== button ===== */
button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: 0.2s;
    font-weight: 500;
}

.btn-primary {
    background: #1f4ed8;
    color: white;
}

.btn-primary:hover {
    background: #1742b3;
}

.btn-primary:disabled {
    background: #ccc;
    color: #888;
    cursor: not-allowed;
}

/* ===== OTP ===== */
.otp-container {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 18px 0;
}

.otp-box {
    width: 42px;
    height: 48px;
    text-align: center;
    font-size: 18px;
    border-radius: 10px;
    border: 1px solid #ddd;
    transition: 0.2s;
}

.otp-box:focus {
    border-color: #1f4ed8;
    box-shadow: 0 0 0 3px rgba(31,78,216,0.15);
    outline: none;
}

/* ===== message ===== */
.msg {
    text-align: center;
    margin-top: 12px;
    font-size: 14px;
    color: #6b7280;
    min-height: 18px;
}

.msg.error { color: #ef4444; }
.msg.success { color: #16a34a; }

</style>
</head>

<body>

<div class="hero">

    <div class="card">

        <div class="login-title">登入 / 註冊</div>

        <input class="phone" id="phone" placeholder="手機號碼">

        <button id="sendBtn" class="btn-primary" disabled>
            寄送驗證碼
        </button>

        <div class="otp-container">
            <input class="otp-box" maxlength="1">
            <input class="otp-box" maxlength="1">
            <input class="otp-box" maxlength="1">
            <input class="otp-box" maxlength="1">
            <input class="otp-box" maxlength="1">
            <input class="otp-box" maxlength="1">
        </div>

        <button id="loginBtn" class="btn-primary" disabled>
            完成
        </button>

        <div id="msg" class="msg"></div>

    </div>

</div>

<!-- CSRF（簡化版） -->
<meta name="csrf-token" content="{{ csrf_token }}">

<script>
const phone = document.getElementById("phone");
const sendBtn = document.getElementById("sendBtn");
const loginBtn = document.getElementById("loginBtn");
const otpBoxes = document.querySelectorAll(".otp-box");
const msg = document.getElementById("msg");

/* ===== CSRF ===== */
function getCSRF() {
    return document.querySelector('meta[name="csrf-token"]').content;
}

/* ===== OTP ===== */
function getOTP(){
    return Array.from(otpBoxes).map(b => b.value).join("");
}

function checkOTP(){
    loginBtn.disabled = getOTP().length !== 6;
}

/* auto focus first */
otpBoxes[0].focus();

otpBoxes.forEach((box,i)=>{
    box.addEventListener("input",()=>{
        box.value = box.value.replace(/\D/g,"");

        if(box.value && i < 5){
            otpBoxes[i+1].focus();
        }

        checkOTP();
    });

    box.addEventListener("keydown",(e)=>{
        if(e.key === "Backspace" && !box.value && i > 0){
            otpBoxes[i-1].focus();
        }
    });
});

/* paste */
otpBoxes[0].addEventListener("paste",(e)=>{
    e.preventDefault();

    let data = e.clipboardData.getData("text")
        .replace(/\D/g,"")
        .slice(0,6);

    otpBoxes.forEach((b,i)=>b.value = data[i] || "");
    checkOTP();
});

/* ===== phone validate ===== */
function updateSend(){
    const ok = /^09\d{8}$/.test(phone.value.trim());
    sendBtn.disabled = !ok;
}

phone.addEventListener("input",updateSend);

/* ===== countdown ===== */
let timer=null;

function startCountdown(){
    let sec = 60;
    sendBtn.disabled = true;

    timer = setInterval(()=>{
        sendBtn.innerText = sec + " 秒";
        sec--;

        if(sec < 0){
            clearInterval(timer);
            sendBtn.innerText = "重新發送";
            updateSend();
        }
    },1000);
}

/* ===== send OTP ===== */
sendBtn.onclick = () => {

    msg.innerText = "";
    msg.className = "msg";

    fetch('/send_otp/',{
        method:'POST',
        credentials:'include',
        headers:{
            'Content-Type':'application/x-www-form-urlencoded',
            'X-CSRFToken': getCSRF()
        },
        body:'phone=' + phone.value
    })
    .then(res => {
        if(!res.ok) throw new Error();
        return res.json();
    })
    .then(data=>{
        msg.innerText = data.message || "OTP 已發送";
        msg.className = "msg success";
        startCountdown();
    })
    .catch(()=>{
        msg.innerText = "發送失敗";
        msg.className = "msg error";
    });
};

/* ===== verify OTP ===== */
loginBtn.onclick = () => {

    fetch('/verify_otp/', {
        method: 'POST',
        credentials: 'include',
        headers: {
            'Content-Type':'application/x-www-form-urlencoded',
            'X-CSRFToken': getCSRF()
        },
        body:`phone=${phone.value}&otp=${getOTP()}`
    })
    .then(res => {
        if(!res.ok) throw new Error();
        return res.json();
    })
    .then(data => {

        if(data.status === "login_success"){
            window.location.href = data.redirect;
        }
        else if(data.status === "need_register"){
            window.location.href = "/register/";
        }
        else {
            msg.innerText = "OTP 錯誤";
            msg.className = "msg error";
        }
    })
    .catch(()=>{
        msg.innerText = "系統錯誤";
        msg.className = "msg error";
    });
};

</script>

</body>
</html>
