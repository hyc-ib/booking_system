{% extends "base.html" %}

{% block content %}

<h2>修改預約</h2>

<form method="post" class="card p-4 mt-3">
    {% csrf_token %}

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <div class="mb-3">
        <label>開始時間</label><br>

        <select name="start_hour">
            {% for i in range_0_24 %}
                <option value="{{ i }}" {% if r.start_time.hour == i %}selected{% endif %}>
                    {{ i }}
                </option>
            {% endfor %}
        </select>

        <select name="start_minute">
            {% for m in minutes %}
                <option value="{{ m }}"
                    {% if r.start_time.minute == m %}selected{% endif %}>
                    {{ m|stringformat:"02d" }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label>結束時間</label><br>

        <select name="end_hour">
            {% for i in range_0_24 %}
                <option value="{{ i }}" {% if r.end_time.hour == i %}selected{% endif %}>
                    {{ i }}
                </option>
            {% endfor %}
        </select>

        <select name="end_minute">
            {% for m in minutes %}
                <option value="{{ m }}"
                    {% if r.end_time.minute == m %}selected{% endif %}>
                    {{ m|stringformat:"02d" }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">
            更新預約
        </button>

        <button type="submit" name="delete" class="btn btn-danger"
                onclick="return confirm('確定要刪除這筆預約嗎？');">
            刪除預約
        </button>
    </div>

</form>

{% endblock %}
