{% extends "base.html" %}
{% load static %}

{% block content %}

<style>
.page-title {
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    margin-top: 10px;
}

/* container */
.car-wrapper {
    display: flex;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
    margin-top: 40px;
}

/* card */
.car-card {
    width: 220px;
    padding: 20px;
    border: none;
    background: white;
    border-radius: 16px;
    cursor: pointer;

    display: flex;
    flex-direction: column;
    align-items: center;

    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    transition: 0.25s ease;
}

/* hover effect */
.car-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

/* image */
.car-img {
    width: 100%;
    height: 140px;
    object-fit: contain;
    margin-bottom: 10px;
}

/* text */
.car-card p {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    color: #333;
}

/* mobile */
@media (max-width: 768px) {
    .car-wrapper {
        flex-direction: column;
        align-items: center;
    }
}

/* ===== Progress Bar (STEP 1 FIXED) ===== */
.progress-wrap {
    display: flex;
    justify-content: center;
    margin: 25px 0;
}

.progress-container {
    width: 60%;
    position: relative;
}

/* background line */
.progress-bg {
    height: 10px;
    background: #e5e7eb;
    border-radius: 20px;
}

/* fill line */
.progress-fill {
    height: 10px;
    width: 0%;
    background: #1f4ed8;
    border-radius: 20px;
    position: absolute;
    top: 0;
    left: 0;
}

/* steps */
.steps {
    display: flex;
    justify-content: space-between;
    position: absolute;
    width: 100%;
    top: -14px;
}

.step {
    text-align: center;
}

.circle {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: auto;
    font-size: 12px;
    color: white;
    background: #ddd;
}

.step.active .circle {
    background: #1f4ed8;
}

.step.done .circle {
    background: #22c55e;
}

.step small {
    font-size: 12px;
}
</style>

<h2 class="page-title">🚗 選擇車型</h2>

<!-- ===== 進度條（Step 1）===== -->
<div class="progress-wrap">
    <div class="progress-container">

        <div class="progress-bg"></div>
        <div class="progress-fill"></div>

        <div class="steps">

            <div class="step active">
                <div class="circle">1</div>
                <small>選車型</small>
            </div>

            <div class="step">
                <div class="circle">2</div>
                <small>選時間</small>
            </div>

            <div class="step">
                <div class="circle">3</div>
                <small>完成</small>
            </div>

        </div>

    </div>
</div>

<form method="post">
    {% csrf_token %}

    <div class="car-wrapper">

        <!-- 4人座 -->
        <button type="submit" name="car_type" value="4人座" class="car-card">
            <img src="{% static 'images/4SeatCar.png' %}" class="car-img">
            <p>4人座</p>
        </button>

        <!-- 10人座 -->
        <button type="submit" name="car_type" value="10人座" class="car-card">
            <img src="{% static 'images/10SeatCar.png' %}" class="car-img">
            <p>10人座</p>
        </button>

    </div>

</form>

{% endblock %}
