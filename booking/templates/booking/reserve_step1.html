{% extends "base.html" %}
{% load static %}

{% block content %}

<style>
.page-title {
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    margin-top: 10px;
}

/* =========================
   PROGRESS BAR（新版）
========================= */

.progress-wrap {
    display: flex;
    justify-content: center;
    margin: 30px 0;
}

.progress-container {
    width: 60%;
    min-width: 320px;
    position: relative;
}

/* 灰色底線 */
.progress-bg {
    height: 6px;
    background: #e5e7eb;
    border-radius: 999px;
}

/* 藍色進度 */
.progress-fill {
    height: 6px;
    width: 0%;   /* ⭐ STEP1 = 0%（只到第一顆） */
    background: #1f4ed8;
    border-radius: 999px;
    position: absolute;
    top: 0;
    left: 0;
}

/* steps（關鍵：三等分定位） */
.steps {
    position: absolute;
    top: -12px;
    left: 0;
    right: 0;
}

/* 每顆圓點 */
.step {
    position: absolute;
    transform: translateX(-50%);
    text-align: center;
}

/* 三個位置 */
.step-1 { left: 0%; }
.step-2 { left: 50%; }
.step-3 { left: 100%; }

/* 圓圈 */
.circle {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #d1d5db;
    color: white;
    font-size: 12px;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* 已完成（藍） */
.step.done .circle {
    background: #1f4ed8;
}

/* 文字 */
.step small {
    display: block;
    margin-top: 5px;
    font-size: 12px;
    color: #666;
}

/* =========================
   卡片（不動）
========================= */

.car-wrapper {
    display: flex;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
    margin-top: 40px;
}

.car-card {
    width: 220px;
    padding: 20px;
    border: none;
    background: white;
    border-radius: 16px;
    cursor: pointer;

    display: flex;
    flex-direction: column;
    align-items: center;

    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    transition: 0.25s ease;
}

.car-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

.car-img {
    width: 100%;
    height: 140px;
    object-fit: contain;
    margin-bottom: 10px;
}
</style>

<h2 class="page-title">選擇車型</h2>

<!-- ===== Progress（STEP1）===== -->
<div class="progress-wrap">
    <div class="progress-container">

        <div class="progress-bg"></div>
        <div class="progress-fill"></div>

        <div class="steps">

            <div class="step step-1 done">
                <div class="circle">1</div>
                <small>選車型</small>
            </div>

            <div class="step step-2">
                <div class="circle">2</div>
                <small>選時間</small>
            </div>

            <div class="step step-3">
                <div class="circle">3</div>
                <small>完成</small>
            </div>

        </div>

    </div>
</div>

<form method="post">
    {% csrf_token %}

    <div class="car-wrapper">

        <button type="submit" name="car_type" value="4人座" class="car-card">
            <img src="{% static 'images/4SeatCar.png' %}" class="car-img">
            <p>4人座</p>
        </button>

        <button type="submit" name="car_type" value="10人座" class="car-card">
            <img src="{% static 'images/10SeatCar.png' %}" class="car-img">
            <p>10人座</p>
        </button>

    </div>

</form>

{% if blocked %}
<div id="riskModal" style="
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
">

    <div style="
        background: white;
        padding: 20px;
        border-radius: 12px;
        width: 300px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    ">

        <h3 style="color:#dc2626;">高風險警告</h3>

        <p>您目前無法借車</p>

        <p style="margin-top:10px;">
            解鎖時間：<br>
            <strong>{{ unlock_time }}</strong>
        </p>

        <button onclick="closeModal()" style="
            margin-top: 15px;
            padding: 8px 16px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        ">
            我知道了
        </button>

    </div>
</div>

<script>
function closeModal() {
    document.getElementById("riskModal").style.display = "none";
}
</script>
{% endif %}

{% endblock %}
