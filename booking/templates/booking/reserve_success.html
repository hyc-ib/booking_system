{% extends "base.html" %}
{% block content %}

<style>
/* =========================
   PROGRESS（Step3）
========================= */

.progress-wrap {
    display: flex;
    justify-content: center;
    margin: 30px 0;
}

.progress-container {
    width: 60%;
    min-width: 320px;
    position: relative;
}

.progress-bg {
    height: 6px;
    background: #e5e7eb;
    border-radius: 999px;
}

.progress-fill {
    height: 6px;
    width: 100%;   /* ⭐ Success = 100% */
    background: #1f4ed8;
    border-radius: 999px;
    position: absolute;
    top: 0;
    left: 0;
}

.steps {
    position: absolute;
    top: -14px;
    left: 0;
    right: 0;
}

.step {
    position: absolute;
    transform: translateX(-50%);
    text-align: center;
}

.step-1 { left: 0%; }
.step-2 { left: 50%; }
.step-3 { left: 100%; }

.circle {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #1f4ed8;
    color: white;
    font-size: 13px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.step small {
    display: block;
    margin-top: 5px;
    font-size: 12px;
    color: #666;
}

/* =========================
   SUCCESS CARD
========================= */

.success-card {
    max-width: 420px;
    margin: 40px auto;
    background: white;
    border-radius: 18px;
    padding: 25px;

    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    border-top: 5px solid #1f4ed8;
}

.title {
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    color: #1f4ed8;
    margin-bottom: 15px;
}

.success-icon {
    text-align: center;
    font-size: 42px;
    margin-bottom: 10px;
}

.row-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
    font-size: 15px;
}

.label {
    color: #666;
}

.value {
    font-weight: bold;
}

/* 按鈕 */
.btn-group {
    margin-top: 20px;
    display: flex;
    gap: 10px;
}

.btn {
    flex: 1;
}

/* mobile */
@media (max-width: 768px) {
    .progress-container {
        width: 90%;
    }
}
</style>

<!-- ===== Progress（STEP3）===== -->
<div class="progress-wrap">
    <div class="progress-container">

        <div class="progress-bg"></div>
        <div class="progress-fill"></div>

        <div class="steps">

            <div class="step step-1">
                <div class="circle">1</div>
                <small>選車型</small>
            </div>

            <div class="step step-2">
                <div class="circle">2</div>
                <small>選時間</small>
            </div>

            <div class="step step-3">
                <div class="circle">3</div>
                <small>完成</small>
            </div>

        </div>

    </div>
</div>

<!-- ===== SUCCESS CARD ===== -->
<div class="success-card">

    <div class="success-icon">🎉</div>

    <div class="title">預約成功</div>

    <div class="row-item">
        <div class="label">預約人</div>
        <div class="value">{{ request.user.username }}</div>
    </div>

    <div class="row-item">
        <div class="label">車輛</div>
        <div class="value">
            {% if car %}
                {{ car.name }} ({{ car.plate }})
            {% else %}
                -
            {% endif %}
        </div>
    </div>

    <div class="row-item">
        <div class="label">借車時間</div>
        <div class="value">{{ start_time }}</div>
    </div>

    <div class="row-item">
        <div class="label">還車時間</div>
        <div class="value">{{ end_time }}</div>
    </div>

    <!-- CTA -->
    <div class="btn-group">
        <a href="/history/" class="btn btn-outline-primary">查看紀錄</a>
        <a href="/" class="btn btn-primary">回首頁</a>
    </div>

</div>

{% endblock %}
