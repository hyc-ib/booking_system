{% extends "base.html" %}

{% block content %}

<h2>車輛報到系統</h2>

<form method="post">
    {% csrf_token %}

    <table class="table table-bordered mt-3">
        <thead>
            <tr>
                <th>✔</th>
                <th>車輛</th>
                <th>開始時間</th>
                <th>結束時間</th>
                <th>狀態</th>
            </tr>
        </thead>
        <tbody>
            {% for r in reservations %}
            <tr>
                <td>
                    <input type="checkbox" name="selected" value="{{ r.id }}">
                </td>

                <td>{{ r.car.plate }}</td>
                <td>{{ r.start_time }}</td>
                <td>{{ r.end_time }}</td>

                <td>
                    {% if r.is_checked_in %}
                        <span class="text-success fw-bold">已報到</span>
                    {% else %}
                        <span class="text-danger fw-bold">未報到</span>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
            </tbody>
    </table>

    <button type="submit" class="btn btn-primary">
        報到
    </button>

</form>

{% endblock %}
