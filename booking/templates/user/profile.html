{% extends "base.html" %}
{% block content %}

<style>
.page {
    max-width: 520px;
    margin: 40px auto;
}

.row {
    display: flex;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid #eee;
}

.label {
    font-weight: bold;
    color: #666;
}

.value {
    display: flex;
    align-items: center;
    gap: 10px;
}

input {
    padding: 6px 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
}

/* btn group */
.btn-group {
    margin-top: 30px;
    display: flex;
    gap: 10px;
    justify-content: center;
}

/* badge */
.badge-ok {
    color: green;
    font-size: 12px;
}

.badge-no {
    color: red;
    font-size: 12px;
}

/* small button */
.small-btn {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid #1f4ed8;
    background: white;
    color: #1f4ed8;
    cursor: pointer;
    transition: 0.2s;
}

.small-btn:hover {
    opacity: 0.85;
}

.small-btn.warning {
    border-color: #f59e0b;
    color: #f59e0b;
}

.small-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

/* logout button */
.logout-wrapper {
    margin-top: 35px;
    display: flex;
    justify-content: center;
}

.logout-btn {
    background: #ef4444;
    color: white;
    border: none;
    padding: 8px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: 0.2s;
}

.logout-btn:hover {
    opacity: 0.85;
    transform: translateY(-1px);
}
</style>

<div class="page">

<h2>個人資料</h2>

<form method="post">
    {% csrf_token %}

    <!-- 姓名 -->
    <div class="row">
        <div class="label">姓名</div>
        <div class="value">{{ request.user.username }}</div>
    </div>

    <!-- 手機 -->
    <div class="row">
        <div class="label">手機</div>
        <div class="value">{{ profile.phone }}</div>
    </div>

    <!-- email -->
    <div class="row">
        <div class="label">信箱</div>

        <div class="value">

            <span id="emailText">{{ profile.email }}</span>

            <input type="email"
                   name="email"
                   id="emailInput"
                   value="{{ profile.email }}"
                   style="display:none;">

            {% if profile.is_email_verified %}
                <span class="badge-ok">已驗證</span>
            {% else %}
                <span class="badge-no">未驗證</span>
            {% endif %}

            <button type="button"
                    id="editBtn"
                    class="small-btn">
                修改
            </button>

            <button type="submit"
                    name="action"
                    value="verify_email"
                    id="verifyBtn"
                    class="small-btn warning"
                    {% if profile.is_email_verified %}disabled{% endif %}>
                驗證
            </button>

        </div>
    </div>

    <!-- 儲存 -->
    <div class="btn-group">

        <button type="submit"
                name="action"
                value="save"
                class="btn btn-primary">
            儲存
        </button>

    </div>

</form>

<!-- ================= 登出 ================= -->
<div style="margin-top: 30px; display:flex; justify-content:center;">

    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}

        <button type="submit"
                style="
                    background: #ef4444;
                    color: white;
                    border: none;
                    padding: 8px 16px;
                    border-radius: 6px;
                    font-size: 14px;
                    cursor: pointer;
                ">
            登出
        </button>

    </form>

</div>

</div>

<script>
const emailText = document.getElementById("emailText");
const emailInput = document.getElementById("emailInput");
const editBtn = document.getElementById("editBtn");
const verifyBtn = document.getElementById("verifyBtn");

let editing = false;

editBtn.addEventListener("click", function () {

    if (!editing) {
        emailText.style.display = "none";
        emailInput.style.display = "inline-block";
        emailInput.focus();

        editBtn.innerText = "取消";
        editing = true;

    } else {
        emailText.style.display = "inline-block";
        emailInput.style.display = "none";

        editBtn.innerText = "修改";
        emailInput.value = emailText.innerText;

        editing = false;
    }
});

emailInput.addEventListener("input", function () {
    if (emailInput.value !== emailText.innerText) {
        verifyBtn.disabled = false;
    }
});
</script>

{% endblock %}
